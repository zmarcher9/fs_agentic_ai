name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # tests/test_highlighting.py drives the guide's sidebar and highlighting
      # in headless Chromium (it skips locally if Chromium is missing).
      - name: Install Chromium for guide tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q
